<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>일정 | 아바홈히어랜나우</title>
<meta name="description" content="아바홈히어랜나우의 예배와 사역 일정. 매주 목요일 오후 7:30 목요열방예배.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@500;600&family=Noto+Sans+Sinhala:wght@400;500;600&family=Noto+Serif+Sinhala:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.cal-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.cal-bar h2{font-family:var(--serif);font-size:30px;font-weight:600;min-width:200px}
.cal-nav{display:flex;gap:8px;align-items:center}
.cal-nav button,.sch-btn{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font-size:14px;color:var(--ink);transition:.2s}
.cal-nav button:hover,.sch-btn:hover{border-color:var(--ink)}
.sch-btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.sch-btn.primary:hover{background:var(--rust);border-color:var(--rust)}
.sch-btn.danger{color:#b3261e;border-color:#e8c4c0}
.admin-bar{display:none;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#fff4e8;border:1px solid #efd6bb;color:var(--rust-2);border-radius:14px;padding:12px 16px;margin-bottom:18px;font-size:14px}
body.is-admin .admin-bar{display:flex}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff}
.cal .wd{padding:10px 8px;font-size:12.5px;font-weight:500;color:var(--muted);background:var(--paper);border-bottom:1px solid var(--line);text-align:center}
.cal .wd.sun{color:#b3261e}
.cal .day{min-height:112px;padding:8px 8px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.cal .day:nth-child(7n){border-right:0}
.cal .day.out{background:#faf7f2;color:#b9aea3}
.cal .day .n{font-size:13px;font-weight:500;line-height:1;margin-bottom:2px}
.cal .day.sun .n{color:#b3261e}
.cal .day.today .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--rust);color:#fff}
body.is-admin .cal .day{cursor:pointer}
body.is-admin .cal .day:hover{background:#fffaf3}
.ev{display:block;width:100%;text-align:left;border:0;border-radius:7px;padding:3px 7px;font-size:12px;line-height:1.4;background:#f3e3d6;color:var(--rust-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev:hover{background:#ecd3bf}
.ev.rec{background:#eef0ea;color:#4d5a43}
.ev b{font-weight:600;margin-right:4px}
.upcoming{margin-top:56px}
.upcoming h3{font-family:var(--serif);font-size:24px;margin-bottom:16px}
.up-list{list-style:none;display:grid;gap:10px}
.up-item{display:grid;grid-template-columns:86px 1fr;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;cursor:pointer;text-align:left;width:100%}
.up-item .d{font-family:var(--en);font-size:22px;line-height:1.1;color:var(--rust)}
.up-item .d small{display:block;font-family:var(--sans);font-size:12px;color:var(--muted)}
.up-item .t{font-weight:600}
.up-item .s{font-size:13.5px;color:var(--muted)}
.empty-up{color:var(--muted);font-size:14.5px}
.sch-dlg{border:0;border-radius:20px;padding:0;max-width:480px;width:calc(100% - 32px);background:var(--paper);color:var(--ink)}
.sch-dlg::backdrop{background:rgba(15,10,8,.55);backdrop-filter:blur(4px)}
.sch-dlg form,.sch-dlg .view{padding:28px 26px 24px}
.sch-dlg h3{font-family:var(--serif);font-size:22px;margin-bottom:18px}
.sch-dlg .fields{grid-template-columns:1fr 1fr;gap:14px}
.sch-dlg .field textarea{min-height:90px}
.sch-dlg .acts{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.sch-dlg .acts div{display:flex;gap:8px}
.sch-dlg .msg{color:#b3261e;font-size:13.5px;margin-top:10px;min-height:1em}
.sch-dlg .view p{color:var(--ink-2);white-space:pre-line}
.sch-dlg .view .meta{color:var(--rust);font-size:14px;margin-bottom:12px}
.admin-link{margin-top:40px;text-align:right}
.admin-link button{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline}
@media (max-width:760px){
  .cal .day{min-height:74px;padding:5px 4px}
  .cal .wd{font-size:11px;padding:8px 2px}
  .ev{font-size:10.5px;padding:2px 4px}
  .ev b{display:none}
  .cal-bar h2{font-size:24px;min-width:0}
  .sch-dlg .fields{grid-template-columns:1fr}
}
</style>
</head>
<body data-page="schedule">

<div class="page-hero">
  <div class="wrap">
    <span class="eyebrow">Schedule</span>
    <h1 id="sch-h1">아바홈 일정</h1>
    <p id="sch-p">예배와 사역, 함께하는 모임 일정을 안내합니다. 매주 목요일 저녁에는 목요열방예배가 있습니다.</p>
  </div>
</div>

<section style="padding-top:56px">
  <div class="wrap">
    <div class="admin-bar"><span id="admin-msg">관리자 모드 · 날짜를 누르면 일정을 추가하고, 일정을 누르면 수정·삭제할 수 있습니다.</span>
      <span style="display:flex;gap:8px"><button class="sch-btn primary" id="btn-add">+ 일정 추가</button><button class="sch-btn" id="btn-logout">관리자 나가기</button></span></div>
    <div class="cal-bar">
      <h2 id="cal-title"></h2>
      <div class="cal-nav">
        <button id="prev" aria-label="Previous month">‹</button>
        <button id="today">오늘</button>
        <button id="next" aria-label="Next month">›</button>
      </div>
    </div>
    <div class="cal" id="cal"></div>

    <div class="upcoming">
      <h3 id="up-h">다가오는 일정</h3>
      <ul class="up-list" id="up-list"></ul>
    </div>
    <div class="admin-link"><button id="btn-admin">관리자</button></div>
  </div>
</section>

<dialog class="sch-dlg" id="dlg-login">
  <form method="dialog" id="f-login">
    <h3 id="l-h">관리자 확인</h3>
    <div class="field"><label for="l-pw" id="l-lbl">비밀번호</label><input type="password" id="l-pw" autocomplete="current-password" required></div>
    <div class="msg" id="l-msg"></div>
    <div class="acts"><span></span><div><button type="button" class="sch-btn" data-close>취소</button><button class="sch-btn primary" id="l-ok">확인</button></div></div>
  </form>
</dialog>

<dialog class="sch-dlg" id="dlg-edit">
  <form method="dialog" id="f-edit">
    <h3 id="e-h">일정 추가</h3>
    <input type="hidden" id="e-id">
    <div class="fields">
      <div class="field full"><label for="e-title" data-k="title">제목</label><input id="e-title" maxlength="120" required></div>
      <div class="field"><label for="e-date" data-k="date">날짜</label><input type="date" id="e-date" required></div>
      <div class="field"><label for="e-end" data-k="end">끝나는 날 (선택)</label><input type="date" id="e-end"></div>
      <div class="field"><label for="e-time" data-k="time">시간 (선택)</label><input id="e-time" maxlength="20" placeholder="19:30"></div>
      <div class="field"><label for="e-place" data-k="place">장소 (선택)</label><input id="e-place" maxlength="120"></div>
      <div class="field full"><label for="e-note" data-k="note">메모 (선택)</label><textarea id="e-note" maxlength="1000"></textarea></div>
    </div>
    <div class="msg" id="e-msg"></div>
    <div class="acts"><button type="button" class="sch-btn danger" id="e-del">삭제</button><div><button type="button" class="sch-btn" data-close>취소</button><button class="sch-btn primary" id="e-save">저장</button></div></div>
  </form>
</dialog>

<dialog class="sch-dlg" id="dlg-view">
  <div class="view">
    <h3 id="v-title"></h3>
    <div class="meta" id="v-meta"></div>
    <p id="v-note"></p>
    <div class="acts"><span></span><div><button type="button" class="sch-btn" data-close>닫기</button></div></div>
  </div>
</dialog>

<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="main.js"></script>

  }

  /* 날짜별 일정 */
  function eventsOn(ds) {
    const list = events.filter(e => e.endDate ? (ds >= e.date && ds <= e.endDate) : ds === e.date);
    if (parse(ds).getDay() === 4) list.unshift({ id: "__weekly", title: L.weekly, time: "19:30", note: L.weeklyNote, rec: true, date: ds });
    return list;
  }

  function render() {
    const y = view.getFullYear(), m = view.getMonth();
    $("cal-title").textContent = new Intl.DateTimeFormat(locale, { year: "numeric", month: "long" }).format(view);
    const start = new Date(y, m, 1 - new Date(y, m, 1).getDay());
    const wdFmt = new Intl.DateTimeFormat(locale, { weekday: "short" });
    let html = "";
    for (let i = 0; i < 7; i++) html += `<div class="wd${i === 0 ? " sun" : ""}">${esc(wdFmt.format(new Date(2026, 0, 4 + i)))}</div>`;
    const todayS = ymd(new Date());
    for (let i = 0; i < 42; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      if (i >= 35 && d.getMonth() !== m) break;
      const ds = ymd(d);
      const cls = ["day", d.getMonth() !== m ? "out" : "", d.getDay() === 0 ? "sun" : "", ds === todayS ? "today" : ""].join(" ");
      html += `<div class="${cls}" data-date="${ds}"><span class="n">${d.getDate()}</span>${eventsOn(ds).map(e =>
        `<button class="ev${e.rec ? " rec" : ""}" data-id="${esc(e.id)}" data-date="${ds}" title="${esc(e.title)}">${e.time ? `<b>${esc(e.time)}</b>` : ""}${esc(e.title)}</button>`).join("")}</div>`;
    }
    $("cal").innerHTML = html;

    const up = events.filter(e => (e.endDate || e.date) >= todayS).slice(0, 10);
    const dFmt = new Intl.DateTimeFormat(locale, { month: "short", day: "numeric", weekday: "short" });
    $("up-list").innerHTML = up.length ? up.map(e => `<li><button class="up-item" data-id="${esc(e.id)}"><span class="d">${esc(e.date.slice(5).replace("-", "."))}<small>${esc(dFmt.format(parse(e.date)))}</small></span><span><span class="t">${esc(e.title)}</span><br><span class="s">${esc([e.time, e.place, e.endDate ? "~ " + e.endDate.slice(5).replace("-", ".") : ""].filter(Boolean).join(" · "))}</span></span></button></li>`).join("")
      : `<li class="empty-up">${esc(L.none)}</li>`;
  }

  /* 보기 / 편집 */
  function openView(e) {
    $("v-title").textContent = e.title;
    $("v-meta").textContent = [e.rec ? "" : e.date.replace(/-/g, ".") + (e.endDate ? " ~ " + e.endDate.replace(/-/g, ".") : ""), e.time, e.place].filter(Boolean).join(" · ");
    $("v-note").textContent = e.note || "";
    $("dlg-view").showModal();
  }
  let delArmed = false;
  function openEdit(e, date) {
    const isNew = !e;
    e = e || { id: "", title: "", date: date || ymd(new Date()), endDate: "", time: "", place: "", note: "" };
    $("e-h").textContent = isNew ? L.addH : L.editH;
    $("e-id").value = e.id; $("e-title").value = e.title; $("e-date").value = e.date; $("e-end").value = e.endDate || "";
    $("e-time").value = e.time || ""; $("e-place").value = e.place || ""; $("e-note").value = e.note || "";
    $("e-del").style.visibility = isNew ? "hidden" : "visible";
    $("e-msg").textContent = ""; delArmed = false; $("e-del").textContent = L.del;
    $("dlg-edit").showModal();
  }
  async function guarded(body, msgEl) {
    try { const j = await api({ ...body, password: getPw() }); events = j.events || events; render(); return true; }
    catch (err) {
      if (err.status === 401) { setPw(""); setAdmin(false); msgEl.textContent = L.wrong; }
      else msgEl.textContent = L.fail;
      return false;
    }
  }
  $("f-edit").addEventListener("submit", async ev => {
    ev.preventDefault();
    const e = { id: $("e-id").value, title: $("e-title").value.trim(), date: $("e-date").value, endDate: $("e-end").value, time: $("e-time").value.trim(), place: $("e-place").value.trim(), note: $("e-note").value.trim() };
    if (!e.title || !e.date) { $("e-msg").textContent = L.need; return; }
    $("e-save").disabled = true;
    if (await guarded({ action: "save", event: e }, $("e-msg"))) $("dlg-edit").close();
    $("e-save").disabled = false;
  });
  $("e-del").onclick = async () => {
    if (!delArmed) { delArmed = true; $("e-msg").textContent = L.delQ; $("e-del").textContent = L.del + " ✓"; return; }
    $("e-del").disabled = true;
    if (await guarded({ action: "delete", id: $("e-id").value }, $("e-msg"))) $("dlg-edit").close();
    $("e-del").disabled = false;
  };

  /* 클릭 */
  const admin = () => document.body.classList.contains("is-admin");
  const findEv = (id, date) => id === "__weekly" ? eventsOn(date)[0] : events.find(x => x.id === id);
  $("cal").addEventListener("click", ev => {
    const b = ev.target.closest(".ev");
    if (b) { const e = findEv(b.dataset.id, b.dataset.date); if (!e) return; return (admin() && !e.rec) ? openEdit(e) : openView(e); }
    const d = ev.target.closest(".day");
    if (d && admin()) openEdit(null, d.dataset.date);
  });
  $("up-list").addEventListener("click", ev => {
    const b = ev.target.closest(".up-item"); if (!b) return;
    const e = events.find(x => x.id === b.dataset.id); if (e) admin() ? openEdit(e) : openView(e);
  });
  $("prev").onclick = () => { view.setMonth(view.getMonth() - 1); render(); };
  $("next").onclick = () => { view.setMonth(view.getMonth() + 1); render(); };
  $("today").onclick = () => { view = new Date(); view.setDate(1); render(); };
  $("btn-add").onclick = () => openEdit(null);
  $("btn-logout").onclick = () => { setPw(""); setAdmin(false); };

  /* 관리자 로그인 */
  $("btn-admin").onclick = () => { $("l-pw").value = ""; $("l-msg").textContent = ""; $("dlg-login").showModal(); };
  $("f-login").addEventListener("submit", async ev => {
    ev.preventDefault();
    const pw = $("l-pw").value; $("l-ok").disabled = true;
    try { await api({ action: "check", password: pw }); setPw(pw); setAdmin(true); $("dlg-login").close(); }
    catch (err) { $("l-msg").textContent = err.status === 401 ? L.wrong : L.fail; }
    $("l-ok").disabled = false;
  });

  render();
  api().then(j => { events = j.events || []; render(); }).catch(() => {
    $("up-list").innerHTML = `<li class="empty-up">${esc(L.loadFail)}</li>`;
  });
})();
</script>
</body>
</html>
